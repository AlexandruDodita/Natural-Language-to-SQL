  - id: q56
    question: How much inventory are we holding?
    lang: en
    category: ambiguous
    tables: [production.productinventory, production.product]
    ordered: false
    gold_sql: null
    note: >
      Units (SUM(quantity)), value at standard cost, and value at list price
      are all defensible and differ by orders of magnitude; list price is zero
      for components, so the choice even changes which products count at all.
      The system should ask "in units or in value - and valued how?".
