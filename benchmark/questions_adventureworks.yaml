# Benchmark question set for the adventureworks database.
#
# Same contract as questions.yaml -- identical fields, identical scoring -- so
# the two sets differ only in the database they interrogate. See that file for
# the field documentation.
#
# What this set is for: car_rental has 9 tables and ~70 columns, so the naive
# arm can put the entire schema in one prompt and still have the right tables
# be obvious. AdventureWorks has 68 tables, 1,099 columns and 91 foreign keys
# across five schemas, and the questions below are written so that finding the
# right three or four tables is itself most of the work. Several deliberately
# sit next to a decoy: product / productmodel / productsubcategory /
# productcategory, salesorderheader / purchaseorderheader, and salesperson /
# salespersonquotahistory are all separate tables with overlapping vocabulary.
#
# Notes on this port that affect gold SQL:
#   * There is no `linetotal` column. It is a computed column in the MSSQL
#     original and the PostgreSQL port drops it, so revenue is written out as
#     unitprice * (1 - unitpricediscount) * orderqty.
#   * sales.salesterritory has a column named `group`, which is reserved and
#     must be quoted.
#   * Order dates span 2011-05-31 to 2014-06-30.

questions:
  # ---- simple: single table, filter or count -------------------------------
  - id: q01
    question: How many products are in the product catalogue?
    lang: en
    category: simple
    tables: [production.product]
    ordered: false
    expected_chart: [none]
    gold_sql: SELECT COUNT(*) FROM production.product

  - id: q02
    question: List the names of all departments.
    lang: en
    category: simple
    tables: [humanresources.department]
    ordered: false
    expected_chart: [none]
    gold_sql: SELECT name FROM humanresources.department

  - id: q03
    question: Ce produse sunt de culoare roșie? Arată numele și prețul de listă.
    lang: ro
    category: simple
    tables: [production.product]
    ordered: false
    expected_chart: [none]
    gold_sql: SELECT name, listprice FROM production.product WHERE color = 'Red'
    note: >
      Romanian, per the bilingual requirement. Also a value-index question:
      "roșie" must link to production.product.color = 'Red', a value, not a
      table or column name.

  - id: q04
    question: How many employees are currently employed?
    lang: en
    category: simple
    tables: [humanresources.employee]
    ordered: false
    expected_chart: [none]
    gold_sql: SELECT COUNT(*) FROM humanresources.employee WHERE currentflag = true

  - id: q05
    question: What credit card types do we accept?
    lang: en
    category: simple
    tables: [sales.creditcard]
    ordered: false
    expected_chart: [none]
    gold_sql: SELECT DISTINCT cardtype FROM sales.creditcard

  # ---- aggregate: grouping and arithmetic ----------------------------------
  - id: q06
    question: What is the total amount due across all sales orders?
    lang: en
    category: aggregate
    tables: [sales.salesorderheader]
    ordered: false
    expected_chart: [none]
    gold_sql: SELECT SUM(totaldue) FROM sales.salesorderheader

  - id: q07
    question: How many sales orders were placed in each calendar year? Show the year and the number of orders.
    lang: en
    category: aggregate
    tables: [sales.salesorderheader]
    ordered: true
    expected_chart: [bar, line]
    gold_sql: >
      SELECT EXTRACT(YEAR FROM orderdate)::int AS yr, COUNT(*) AS orders
      FROM sales.salesorderheader GROUP BY yr ORDER BY yr

  - id: q08
    question: What is the average list price of products that have a list price above zero?
    lang: en
    category: aggregate
    tables: [production.product]
    ordered: false
    expected_chart: [none]
    gold_sql: SELECT AVG(listprice) FROM production.product WHERE listprice > 0

  - id: q09
    question: Câte comenzi de achiziție are fiecare furnizor care are cel puțin o comandă? Arată numele furnizorului și numărul de comenzi.
    lang: ro
    category: aggregate
    tables: [purchasing.purchaseorderheader, purchasing.vendor]
    ordered: false
    expected_chart: [bar]
    gold_sql: >
      SELECT v.name, COUNT(*) AS orders
      FROM purchasing.purchaseorderheader h
      JOIN purchasing.vendor v ON v.businessentityid = h.vendorid
      GROUP BY v.name
    note: >
      Romanian, and a decoy: "comenzi" maps to purchaseorderheader here, not
      salesorderheader, which is the larger and more obvious orders table.
      Not a top-N question: 60+ vendors tie at exactly 51 purchase orders, so
      any "top 5" would have no determinate answer to score against.

  - id: q10
    question: How many products are there in each product line, including the products with no product line assigned? Show the product line and the number of products.
    lang: en
    category: aggregate
    tables: [production.product]
    ordered: false
    expected_chart: [bar, pie]
    gold_sql: SELECT productline, COUNT(*) AS n FROM production.product GROUP BY productline

  - id: q11
    question: What are the highest and lowest list prices in the catalogue?
    lang: en
    category: aggregate
    tables: [production.product]
    ordered: false
    expected_chart: [none]
    gold_sql: SELECT MAX(listprice) AS highest, MIN(listprice) AS lowest FROM production.product

  # ---- join: multi-table, several of them cross-schema ---------------------
  - id: q12
    question: What are the top 10 products by total sales revenue? Show the product name and the revenue.
    lang: en
    category: join
    tables: [sales.salesorderdetail, production.product]
    ordered: true
    expected_chart: [bar]
    gold_sql: >
      SELECT p.name,
             SUM(d.unitprice * (1 - d.unitpricediscount) * d.orderqty) AS revenue
      FROM sales.salesorderdetail d
      JOIN production.product p ON p.productid = d.productid
      GROUP BY p.name ORDER BY revenue DESC, p.name LIMIT 10
    note: Cross-schema join, sales -> production.

  - id: q13
    question: Which sales territory generated the most revenue from sales orders, counting the total due on each order? Show the territory name and the revenue.
    lang: en
    category: join
    tables: [sales.salesorderheader, sales.salesterritory]
    ordered: true
    expected_chart: [bar]
    gold_sql: >
      SELECT t.name, SUM(h.totaldue) AS revenue
      FROM sales.salesorderheader h
      JOIN sales.salesterritory t ON t.territoryid = h.territoryid
      GROUP BY t.name ORDER BY revenue DESC LIMIT 1

  - id: q14
    question: Show the first name, last name and job title of every sales person.
    lang: en
    category: join
    tables: [sales.salesperson, humanresources.employee, person.person]
    ordered: false
    expected_chart: [none]
    gold_sql: >
      SELECT pe.firstname, pe.lastname, e.jobtitle
      FROM sales.salesperson sp
      JOIN humanresources.employee e ON e.businessentityid = sp.businessentityid
      JOIN person.person pe ON pe.businessentityid = sp.businessentityid
    note: >
      The businessentityid indirection: a sales person is an employee is a
      person, and the name lives two tables away from the sales table. Three
      schemas in one query.

  - id: q15
    question: Which products does the vendor 'Mountain Works' supply? Show the product names.
    lang: en
    category: join
    tables: [purchasing.productvendor, purchasing.vendor, production.product]
    ordered: false
    expected_chart: [none]
    gold_sql: >
      SELECT p.name
      FROM purchasing.productvendor pv
      JOIN purchasing.vendor v ON v.businessentityid = pv.businessentityid
      JOIN production.product p ON p.productid = pv.productid
      WHERE v.name = 'Mountain Works'

  - id: q16
    question: What is the total sales revenue for each product category? Show the category name and the revenue.
    lang: en
    category: join
    tables: [sales.salesorderdetail, production.product, production.productsubcategory, production.productcategory]
    ordered: false
    expected_chart: [bar, pie]
    gold_sql: >
      SELECT c.name AS category,
             SUM(d.unitprice * (1 - d.unitpricediscount) * d.orderqty) AS revenue
      FROM sales.salesorderdetail d
      JOIN production.product p ON p.productid = d.productid
      JOIN production.productsubcategory s ON s.productsubcategoryid = p.productsubcategoryid
      JOIN production.productcategory c ON c.productcategoryid = s.productcategoryid
      GROUP BY c.name
    note: >
      Four-table chain through the category hierarchy. product ->
      productsubcategory -> productcategory is exactly the kind of two-hop
      lookup that a schema-selection step has to get right.

  - id: q17
    question: List the name and the group of each sales territory.
    lang: en
    category: join
    tables: [sales.salesterritory]
    ordered: false
    expected_chart: [none]
    gold_sql: SELECT name, "group" FROM sales.salesterritory
    note: >
      `group` is a reserved word and must be quoted. Single-table, but it is
      here to catch a model that emits syntactically invalid SQL.

  - id: q18
    question: How many sales orders were shipped to each country? Show the country name and the count.
    lang: en
    category: join
    tables: [sales.salesorderheader, person.address, person.stateprovince, person.countryregion]
    ordered: false
    expected_chart: [bar]
    gold_sql: >
      SELECT cr.name AS country, COUNT(*) AS orders
      FROM sales.salesorderheader h
      JOIN person.address a ON a.addressid = h.shiptoaddressid
      JOIN person.stateprovince sp ON sp.stateprovinceid = a.stateprovinceid
      JOIN person.countryregion cr ON cr.countryregioncode = sp.countryregioncode
      GROUP BY cr.name
    note: >
      Four tables, and the join must pick shiptoaddressid rather than
      billtoaddressid -- two columns of the same type on the same table.

  - id: q19
    question: Which shipping method is used on the most sales orders? Show the method name and the number of orders.
    lang: en
    category: join
    tables: [sales.salesorderheader, purchasing.shipmethod]
    ordered: true
    expected_chart: [bar]
    gold_sql: >
      SELECT sm.name, COUNT(*) AS orders
      FROM sales.salesorderheader h
      JOIN purchasing.shipmethod sm ON sm.shipmethodid = h.shipmethodid
      GROUP BY sm.name ORDER BY orders DESC LIMIT 1
    note: shipmethod lives in the purchasing schema but is used by sales orders.

  # ---- subquery ------------------------------------------------------------
  - id: q20
    question: Which products have never been ordered? Show their names.
    lang: en
    category: subquery
    tables: [production.product, sales.salesorderdetail]
    ordered: false
    expected_chart: [none]
    gold_sql: >
      SELECT p.name FROM production.product p
      WHERE NOT EXISTS (SELECT 1 FROM sales.salesorderdetail d
                        WHERE d.productid = p.productid)

  - id: q21
    question: Which products have a list price higher than the average list price of their own subcategory? Show the product name and its list price.
    lang: en
    category: subquery
    tables: [production.product]
    ordered: false
    expected_chart: [none]
    gold_sql: >
      SELECT p.name, p.listprice FROM production.product p
      WHERE p.productsubcategoryid IS NOT NULL
        AND p.listprice > (SELECT AVG(p2.listprice) FROM production.product p2
                           WHERE p2.productsubcategoryid = p.productsubcategoryid)
    note: Correlated subquery against the same table.

  - id: q22
    question: Which vendors have never had a purchase order? Show the vendor names.
    lang: en
    category: subquery
    tables: [purchasing.vendor, purchasing.purchaseorderheader]
    ordered: false
    expected_chart: [none]
    gold_sql: >
      SELECT v.name FROM purchasing.vendor v
      WHERE NOT EXISTS (SELECT 1 FROM purchasing.purchaseorderheader h
                        WHERE h.vendorid = v.businessentityid)

  - id: q23
    question: Which employees have a current pay rate above the average current pay rate? Show the first name, last name and the rate.
    lang: en
    category: subquery
    tables: [humanresources.employeepayhistory, person.person]
    ordered: false
    expected_chart: [none]
    gold_sql: >
      WITH current_rate AS (
        SELECT DISTINCT ON (businessentityid) businessentityid, rate
        FROM humanresources.employeepayhistory
        ORDER BY businessentityid, ratechangedate DESC)
      SELECT pe.firstname, pe.lastname, cr.rate
      FROM current_rate cr
      JOIN person.person pe ON pe.businessentityid = cr.businessentityid
      WHERE cr.rate > (SELECT AVG(rate) FROM current_rate)
    note: >
      employeepayhistory holds one row per raise, so "current rate" means the
      latest row per employee -- a model that averages the raw table gets a
      different answer.

  # ---- window --------------------------------------------------------------
  - id: q24
    question: For each product category, show the top 3 products by sales revenue. Show the category name, the product name and the revenue.
    lang: en
    category: window
    tables: [sales.salesorderdetail, production.product, production.productsubcategory, production.productcategory]
    ordered: false
    expected_chart: [bar]
    gold_sql: >
      WITH rev AS (
        SELECT c.name AS category, p.name AS product,
               SUM(d.unitprice * (1 - d.unitpricediscount) * d.orderqty) AS revenue
        FROM sales.salesorderdetail d
        JOIN production.product p ON p.productid = d.productid
        JOIN production.productsubcategory s ON s.productsubcategoryid = p.productsubcategoryid
        JOIN production.productcategory c ON c.productcategoryid = s.productcategoryid
        GROUP BY c.name, p.name),
      ranked AS (
        SELECT category, product, revenue,
               ROW_NUMBER() OVER (PARTITION BY category ORDER BY revenue DESC, product) AS rn
        FROM rev)
      SELECT category, product, revenue FROM ranked WHERE rn <= 3

  - id: q25
    question: Rank the sales people by their year-to-date sales, highest first. Show the first name, last name, the year-to-date sales and the rank.
    lang: en
    category: window
    tables: [sales.salesperson, person.person]
    ordered: true
    expected_chart: [bar]
    gold_sql: >
      SELECT pe.firstname, pe.lastname, sp.salesytd,
             RANK() OVER (ORDER BY sp.salesytd DESC) AS rnk
      FROM sales.salesperson sp
      JOIN person.person pe ON pe.businessentityid = sp.businessentityid
      ORDER BY sp.salesytd DESC

  - id: q26
    question: For each sales territory, show the revenue per year, counting the total due on each order, and a running total across the years. Show the territory name, the year, that year's revenue and the running total.
    lang: en
    category: window
    tables: [sales.salesorderheader, sales.salesterritory]
    ordered: false
    expected_chart: [line, bar]
    gold_sql: >
      WITH yearly AS (
        SELECT t.name AS territory, EXTRACT(YEAR FROM h.orderdate)::int AS yr,
               SUM(h.totaldue) AS revenue
        FROM sales.salesorderheader h
        JOIN sales.salesterritory t ON t.territoryid = h.territoryid
        GROUP BY t.name, yr)
      SELECT territory, yr, revenue,
             SUM(revenue) OVER (PARTITION BY territory ORDER BY yr
                                ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running_total
      FROM yearly

  # ---- harder set -----------------------------------------------------------
  # Added after the first run: every one of the five hosted models scored at or
  # near 100% on the questions above, which measures nothing. A benchmark whose
  # weakest entrant is saturated cannot rank anything. These reach further into
  # the schema -- history tables that need a currency filter, a recursive bill
  # of materials, relational division, a window over an aggregate -- and are
  # where the 68-table schema actually costs something.

  - id: q31
    question: How many sales orders were placed online versus not online, and what percentage of the total is each? Show the online flag, the count and the percentage rounded to two decimals.
    lang: en
    category: aggregate
    tables: [sales.salesorderheader]
    ordered: false
    expected_chart: [bar, pie]
    gold_sql: >
      SELECT onlineorderflag, COUNT(*) AS orders,
             ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER (), 2) AS pct
      FROM sales.salesorderheader GROUP BY onlineorderflag
    note: A window function over an aggregate -- the percentage needs the grand total.

  - id: q32
    question: Which three scrap reasons account for the most scrapped units? Show the reason name and the total scrapped quantity.
    lang: en
    category: aggregate
    tables: [production.workorder, production.scrapreason]
    ordered: true
    expected_chart: [bar]
    gold_sql: >
      SELECT sr.name, SUM(w.scrappedqty) AS scrapped
      FROM production.workorder w
      JOIN production.scrapreason sr ON sr.scrapreasonid = w.scrapreasonid
      GROUP BY sr.name ORDER BY scrapped DESC LIMIT 3
    note: >
      workorder.scrapreasonid is nullable and most rows are null, so the join
      itself is the filter. Ranks 3 and 4 differ (876 vs 826), so the cut is
      determinate.

  - id: q33
    question: How many employees currently work in each department? Show the department name and the number of employees.
    lang: en
    category: join
    tables: [humanresources.employeedepartmenthistory, humanresources.department]
    ordered: false
    expected_chart: [bar]
    gold_sql: >
      SELECT d.name, COUNT(*) AS employees
      FROM humanresources.employeedepartmenthistory h
      JOIN humanresources.department d ON d.departmentid = h.departmentid
      WHERE h.enddate IS NULL
      GROUP BY d.name
    note: >
      employeedepartmenthistory is a history table with one row per posting.
      "Currently" means enddate IS NULL; without that filter an employee who
      has transferred is counted in both departments.

  - id: q34
    question: For each sales territory, who is the sales person with the highest year-to-date sales? Show the territory name, the first name, the last name and the sales figure.
    lang: en
    category: join
    tables: [sales.salesperson, sales.salesterritory, person.person]
    ordered: false
    expected_chart: [bar]
    gold_sql: >
      SELECT t.name, pe.firstname, pe.lastname, sp.salesytd
      FROM sales.salesperson sp
      JOIN sales.salesterritory t ON t.territoryid = sp.territoryid
      JOIN person.person pe ON pe.businessentityid = sp.businessentityid
      WHERE sp.salesytd = (SELECT MAX(s2.salesytd) FROM sales.salesperson s2
                           WHERE s2.territoryid = sp.territoryid)
    note: >
      Per-group argmax across three tables and two schemas. Sales people with no
      territory are excluded by the join, which is the intended reading.

  - id: q35
    question: How many distinct components go into the product 'Mountain-100 Black, 44' at any level of its bill of materials?
    lang: en
    category: subquery
    tables: [production.billofmaterials, production.product]
    ordered: false
    expected_chart: [none]
    gold_sql: >
      WITH RECURSIVE bom AS (
        SELECT b.componentid FROM production.billofmaterials b
        JOIN production.product p ON p.productid = b.productassemblyid
        WHERE p.name = 'Mountain-100 Black, 44' AND b.enddate IS NULL
        UNION
        SELECT b.componentid FROM production.billofmaterials b
        JOIN bom ON bom.componentid = b.productassemblyid
        WHERE b.enddate IS NULL)
      SELECT COUNT(DISTINCT componentid) FROM bom
    note: >
      Needs WITH RECURSIVE: a bill of materials nests to several levels and a
      single join answers only the top one. The enddate filter matters too --
      billofmaterials keeps superseded rows.

  - id: q36
    question: Which products have been sold in every sales territory? Show the product names.
    lang: en
    category: subquery
    tables: [production.product, sales.salesorderheader, sales.salesorderdetail, sales.salesterritory]
    ordered: false
    expected_chart: [none]
    gold_sql: >
      SELECT p.name FROM production.product p
      WHERE NOT EXISTS (
        SELECT 1 FROM sales.salesterritory t WHERE NOT EXISTS (
          SELECT 1 FROM sales.salesorderheader h
          JOIN sales.salesorderdetail d ON d.salesorderid = h.salesorderid
          WHERE d.productid = p.productid AND h.territoryid = t.territoryid))
    note: >
      Relational division -- "for all" has no direct SQL operator and needs the
      doubly-nested NOT EXISTS, or a count-matching equivalent.

  - id: q37
    question: Which products have less total inventory on hand than their reorder point, counting a product with no inventory records as zero on hand? Show the product name, the quantity on hand and the reorder point.
    lang: en
    category: subquery
    tables: [production.product, production.productinventory]
    ordered: false
    expected_chart: [bar]
    gold_sql: >
      SELECT p.name, COALESCE(SUM(i.quantity), 0) AS on_hand, p.reorderpoint
      FROM production.product p
      LEFT JOIN production.productinventory i ON i.productid = p.productid
      GROUP BY p.productid, p.name, p.reorderpoint
      HAVING COALESCE(SUM(i.quantity), 0) < p.reorderpoint
    note: >
      Inventory is held per location, so the comparison is against the summed
      quantity and belongs in HAVING, not WHERE. The join must be a LEFT join:
      a product with no inventory row has none on hand, which is below any
      positive reorder point.

  - id: q38
    question: For each month of 2013, show the month as a date (the first day of that month), the total revenue counting the total due on each order, and the percentage change in revenue from the preceding calendar month (for January 2013 that is December 2012), rounded to two decimals.
    lang: en
    category: window
    tables: [sales.salesorderheader]
    ordered: true
    expected_chart: [line, bar]
    gold_sql: >
      WITH m AS (
        SELECT DATE_TRUNC('month', orderdate)::date AS mo, SUM(totaldue) AS revenue
        FROM sales.salesorderheader GROUP BY 1),
      lagged AS (
        SELECT mo, revenue, LAG(revenue) OVER (ORDER BY mo) AS prev FROM m)
      SELECT mo, revenue, ROUND(100.0 * (revenue - prev) / prev, 2) AS pct_change
      FROM lagged WHERE EXTRACT(YEAR FROM mo) = 2013 ORDER BY mo
    note: >
      LAG over a monthly aggregate. Two things are pinned because both are
      choices rather than skills: how the month is represented (the integer
      1..12 or a date), and where the year filter goes. Aggregating 2013 alone
      makes January's change null; aggregating every month and filtering the
      output afterwards compares January 2013 against December 2012, which is
      what "the preceding calendar month" means and what four of five models
      did unprompted. The gold follows the models here -- they had the better
      reading and the first version of this question scored them down for it.

  # ---- ambiguous: no single correct answer; scored on asking, not guessing --
  - id: q27
    question: Show me our best customers.
    lang: en
    category: ambiguous
    tables: [sales.customer]
    ordered: false
    gold_sql: null
    note: >
      "Best" has no column to map to -- order count, total spend and tenure are
      all defensible, and the customer table itself mixes stores and individuals.

  - id: q28
    question: Care sunt cele mai bune produse?
    lang: ro
    category: ambiguous
    tables: [production.product]
    ordered: false
    gold_sql: null
    note: >
      Romanian ambiguity: "cele mai bune" could rank by revenue, units sold,
      review rating or margin.

  - id: q29
    question: How many customers do we have?
    lang: en
    category: ambiguous
    tables: [sales.customer]
    ordered: false
    gold_sql: null
    note: >
      Schema-specific ambiguity worth more than the generic kind. sales.customer
      has 19,820 rows, of which 1,336 carry a storeid and 19,119 carry a
      personid -- the two overlap, so a store's customer rows and the individual
      buyers are counted in the same table. "Customer" can mean rows, distinct
      people, or distinct stores, and the three give different numbers.

  - id: q30
    question: What were our sales last year?
    lang: en
    category: ambiguous
    tables: [sales.salesorderheader]
    ordered: false
    gold_sql: null
    note: >
      "Last year" has no anchor: the data ends 30 June 2014, so relative to now
      the answer is empty, and relative to the data it is 2013 or a trailing
      twelve months. The system should ask rather than pick one.


  # =========================================================================
  # Second wave (q39-q56): questions that discriminate at the frontier.
  #
  # q01-q38 are saturated -- four of five hosted models score 34/34. The 68-table
  # schema raised the cost of the prompt without raising the difficulty of the
  # query, which is the finding Spider 2.0 reports too: its difficulty premium
  # came from query shape, not schema size (gold SQL averaging 144.5 tokens
  # against BIRD's 30.9). See research.md.
  #
  # These exploit AdventureWorks features no earlier question touches: the
  # effective-dated history tables (productcosthistory, employeepayhistory,
  # salespersonquotahistory), the transactionhistoryarchive twin, the nullable
  # creditcardid FK, and the many-to-many sales-reason bridge. Each carries a
  # named TRAP that executes cleanly and returns different numbers.
  #
  # Every gold query was executed against the loaded database. Categories are
  # the same additive set documented in questions.yaml.
  # =========================================================================

  # Trap (verified): using `product.standardcost` (the current cost, a decoy
  # column on the obvious table) gives Bikes a margin of 2,582,240 vs the
  # correct 3,286,316; joining the history without the date predicate fans out
  # every line with 2-3 cost periods and inflates both terms.
  - id: q39
    question: For each product category, what was the gross margin on sales orders placed in 2013? Revenue is unitprice times (1 minus unitpricediscount) times quantity; cost is the product's standard cost that was in effect on the order date according to the cost history, times quantity. Count only order lines whose order date falls inside a recorded standard-cost period. Show the category name and the margin rounded to two decimals.
    lang: en
    category: temporal
    tables: [sales.salesorderdetail, sales.salesorderheader, production.productcosthistory, production.product, production.productsubcategory, production.productcategory]
    ordered: false
    expected_chart: [bar, pie]
    gold_sql: >
      SELECT c.name,
             ROUND(SUM(d.unitprice * (1 - d.unitpricediscount) * d.orderqty
                       - ch.standardcost * d.orderqty), 2) AS gross_margin
      FROM sales.salesorderdetail d
      JOIN sales.salesorderheader h ON h.salesorderid = d.salesorderid
      JOIN production.productcosthistory ch ON ch.productid = d.productid
       AND h.orderdate >= ch.startdate
       AND (ch.enddate IS NULL OR h.orderdate <= ch.enddate)
      JOIN production.product p ON p.productid = d.productid
      JOIN production.productsubcategory s ON s.productsubcategoryid = p.productsubcategoryid
      JOIN production.productcategory c ON c.productcategoryid = s.productcategoryid
      WHERE h.orderdate >= DATE '2013-01-01' AND h.orderdate < DATE '2014-01-01'
      GROUP BY c.name
    note: >
      Temporal (effective-dated) join: 77 products have multiple cost periods,
      so the date predicate on the history join is load-bearing. 45 order
      lines of 2013 fall outside every recorded period; the question pins
      their exclusion (the inner join's natural behaviour). Returns 4 rows.

  # Trap (verified): `WHERE creditcardid NOT IN (SELECT creditcardid FROM
  # sales.salesorderheader)` returns **0** because the subquery contains NULLs
  # — executed, it yields a clean, confident, wrong scalar. No published
  # benchmark category tests this; it is pure silent-failure territory.
  - id: q40
    question: How many credit cards on file have never been used on any sales order? Return a single number.
    lang: en
    category: anti_join
    tables: [sales.creditcard, sales.salesorderheader]
    ordered: false
    expected_chart: [none]
    gold_sql: >
      SELECT COUNT(*) AS unused_cards
      FROM sales.creditcard c
      WHERE NOT EXISTS (SELECT 1 FROM sales.salesorderheader h
                        WHERE h.creditcardid = c.creditcardid)
    note: >
      salesorderheader.creditcardid is NULL on every cash order, which arms
      the classic three-valued-logic trap. Answer: 734.

  # Trap (verified): `SUM(COUNT(*)) OVER ()` as the denominator — the pattern
  # the existing q31 rewards — computes percentage of citations: Price comes
  # out 63.20% instead of 55.53% (verified). The right instinct from the
  # earlier question is the wrong query here.
  - id: q41
    question: For each sales reason that appears on at least one sales order, show the reason name, the number of sales orders citing it, and that number as a percentage of all sales orders (not of reason citations), rounded to two decimals. An order can cite several reasons, so the percentages need not sum to 100.
    lang: en
    category: multi_level_agg
    tables: [sales.salesorderheadersalesreason, sales.salesreason, sales.salesorderheader]
    ordered: false
    expected_chart: [bar]
    gold_sql: >
      SELECT sr.name, COUNT(*) AS orders,
             ROUND(100.0 * COUNT(*) / (SELECT COUNT(*) FROM sales.salesorderheader), 2) AS pct_of_all_orders
      FROM sales.salesorderheadersalesreason x
      JOIN sales.salesreason sr ON sr.salesreasonid = x.salesreasonid
      GROUP BY sr.name
    note: >
      The denominator lives in a table the numerator never touches. 4,482
      orders cite more than one reason, so the bridge-table total (27,647
      citations) and the order total (31,465) differ by enough to move every
      percentage. Returns 7 rows.

  # Trap (verified): querying only transactionhistory returns S = 74,575 —
  # same shape, right types, 40% of the answer missing. Pre-aggregating each
  # table and UNION-ing the *aggregates* (instead of UNION ALL then grouping)
  # yields six rows or, with plain UNION, silently merges equal counts.
  - id: q42
    question: Câte tranzacții de inventar există pentru fiecare tip de tranzacție, luând în calcul atât istoricul curent de tranzacții cât și arhiva de istoric? Arată tipul tranzacției și numărul total de tranzacții.
    lang: ro
    category: set_ops
    tables: [production.transactionhistory, production.transactionhistoryarchive]
    ordered: false
    expected_chart: [bar, pie]
    gold_sql: >
      SELECT transactiontype, COUNT(*) AS transactions FROM (
        SELECT transactiontype FROM production.transactionhistory
        UNION ALL
        SELECT transactiontype FROM production.transactionhistoryarchive) t
      GROUP BY transactiontype
    note: >
      UNION ALL across a table and its archive twin - the AdventureWorks
      pattern nothing in the current set touches. Returns 3 rows
      (P: 8,788 / S: 121,317 / W: 72,591).

  # Trap (by construction): LAG(1) compares January 2013 to December 2012 —
  # the exact gold answer of q38 — and differs in all 12 rows.
  - id: q43
    question: For each month of 2013, show the month as a date (the first day of the month), the total revenue counting the total due on each order, and the percentage change versus the same month of 2012, rounded to two decimals.
    lang: en
    category: temporal
    tables: [sales.salesorderheader]
    ordered: true
    expected_chart: [line, bar]
    gold_sql: >
      WITH m AS (
        SELECT DATE_TRUNC('month', orderdate)::date AS month, SUM(totaldue) AS revenue
        FROM sales.salesorderheader GROUP BY 1)
      SELECT a.month, a.revenue,
             ROUND(100.0 * (a.revenue - b.revenue) / b.revenue, 2) AS yoy_pct
      FROM m a JOIN m b ON b.month = a.month - INTERVAL '1 year'
      WHERE a.month >= DATE '2013-01-01' AND a.month < DATE '2014-01-01'
      ORDER BY a.month
    note: >
      Deliberately adjacent to the existing q38 (month-over-month LAG): a
      model that pattern-matches to its q38 answer fails here. Jan 2013 vs Jan
      2012 is -47.51%. Returns 12 rows.

  # Trap (by construction): joining quota history to orders in one FROM
  # multiplies each quota row by that person's order count and each order by
  # 4; the decoy `salesperson.salesquota` scalar column (a different number)
  # is sitting on the obvious table.
  - id: q44
    question: For each salesperson who had a sales quota set during 2013, show their first name, their last name, the sum of their 2013 quota amounts from the quota history, their actual 2013 sales as the sum of the total due on orders where they are the salesperson, rounded to two decimals, and the difference of actual minus quota, rounded to two decimals.
    lang: en
    category: multi_level_agg
    tables: [sales.salespersonquotahistory, sales.salesorderheader, person.person]
    ordered: false
    expected_chart: [bar, none]
    gold_sql: >
      WITH quota AS (
        SELECT businessentityid, SUM(salesquota) AS quota
        FROM sales.salespersonquotahistory
        WHERE quotadate >= DATE '2013-01-01' AND quotadate < DATE '2014-01-01'
        GROUP BY businessentityid),
      actual AS (
        SELECT salespersonid, SUM(totaldue) AS actual
        FROM sales.salesorderheader
        WHERE salespersonid IS NOT NULL
          AND orderdate >= DATE '2013-01-01' AND orderdate < DATE '2014-01-01'
        GROUP BY salespersonid)
      SELECT pe.firstname, pe.lastname, q.quota,
             ROUND(a.actual, 2) AS actual,
             ROUND(a.actual - q.quota, 2) AS difference
      FROM quota q
      JOIN actual a ON a.salespersonid = q.businessentityid
      JOIN person.person pe ON pe.businessentityid = q.businessentityid
    note: >
      Two aggregates at different grains (4 quarterly quota rows vs hundreds
      of orders per person) that must be computed separately. All 17 quota
      holders also sold in 2013, so the join drops no one. Returns 17 rows.

  # Trap (by construction): unquoted `group` is a syntax error; the long
  # format (group, flag, revenue) is 6 rows x 3 cols and fails the shape
  # check.
  - id: q45
    question: For each sales territory group, show the group name, the total revenue counting the total due on online orders, and the total revenue counting the total due on orders that are not online, as two separate revenue columns rounded to two decimals.
    lang: en
    category: pivot
    tables: [sales.salesorderheader, sales.salesterritory]
    ordered: false
    expected_chart: [bar]
    gold_sql: >
      SELECT t."group",
             ROUND(SUM(h.totaldue) FILTER (WHERE h.onlineorderflag), 2) AS online_revenue,
             ROUND(SUM(h.totaldue) FILTER (WHERE NOT h.onlineorderflag), 2) AS offline_revenue
      FROM sales.salesorderheader h
      JOIN sales.salesterritory t ON t.territoryid = h.territoryid
      GROUP BY t."group"
    note: >
      Conditional aggregation over the boolean flag, grouped by the reserved
      word column the existing q17 already flags. Returns 3 rows (Europe,
      North America, Pacific).

  # Trap (verified): PERCENTILE_DISC differs from CONT (France 858.96 vs
  # 859.02 — one cell, which is all the scorer needs); skipping the ::numeric
  # cast makes ROUND(double, 2) fail outright in PostgreSQL.
  - id: q46
    question: For each sales territory, show the territory name, the mean order value and the median order value of the total due across its sales orders, both rounded to two decimals. Use the interpolated median (the average of the two middle values when the count is even).
    lang: en
    category: percentile
    tables: [sales.salesorderheader, sales.salesterritory]
    ordered: false
    expected_chart: [bar, none]
    gold_sql: >
      SELECT t.name,
             ROUND(AVG(h.totaldue), 2) AS mean_value,
             ROUND((PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY h.totaldue))::numeric, 2) AS median_value
      FROM sales.salesorderheader h
      JOIN sales.salesterritory t ON t.territoryid = h.territoryid
      GROUP BY t.name
    note: >
      The skew is the story: Canada's mean is 4,523.96 against a median of
      87.27, because a few reseller orders dwarf thousands of online ones.
      Returns 10 rows.

  # Trap (verified): the single-level join returns 3; even a two-level self-
  # join returns a fraction of 178. Only recursion (or an exhaustive N-level
  # unrolling) reaches the answer.
  - id: q47
    question: How many distinct product assemblies contain the component named 'Blade' at any depth of the current bill of materials - directly or through intermediate assemblies? Return a single number.
    lang: en
    category: recursive
    tables: [production.billofmaterials, production.product]
    ordered: false
    expected_chart: [none]
    gold_sql: >
      WITH RECURSIVE used_in AS (
        SELECT b.productassemblyid
        FROM production.billofmaterials b
        JOIN production.product c ON c.productid = b.componentid
        WHERE c.name = 'Blade' AND b.enddate IS NULL
        UNION
        SELECT b.productassemblyid
        FROM production.billofmaterials b
        JOIN used_in u ON u.productassemblyid = b.componentid
        WHERE b.enddate IS NULL)
      SELECT COUNT(DISTINCT productassemblyid) AS assemblies FROM used_in
    note: >
      The inverse of the existing q35: where-used (upward) instead of explode
      (downward). Chosen because for 'Blade' the depth genuinely matters:
      answer 178, vs 3 direct parents. (Verified that the enddate filter does
      not change this particular count, so a model omitting it is not unfairly
      failed - the discriminator is the recursion, not the filter.)

  # Trap (verified): `100 * AVG(unitpricediscount)` — Accessories 0.08 vs
  # 0.52, Clothing 0.20 vs 0.98.
  - id: q48
    question: For each product category, what is the value-weighted average discount rate on its sales order lines - the sum of unitpricediscount times unitprice times quantity, divided by the sum of unitprice times quantity - expressed as a percentage rounded to two decimals? Show the category name and the percentage.
    lang: en
    category: ratio
    tables: [sales.salesorderdetail, production.product, production.productsubcategory, production.productcategory]
    ordered: false
    expected_chart: [bar]
    gold_sql: >
      SELECT c.name,
             ROUND(100.0 * SUM(d.unitpricediscount * d.unitprice * d.orderqty)
                   / SUM(d.unitprice * d.orderqty), 2) AS weighted_discount_pct
      FROM sales.salesorderdetail d
      JOIN production.product p ON p.productid = d.productid
      JOIN production.productsubcategory s ON s.productsubcategoryid = p.productsubcategoryid
      JOIN production.productcategory c ON c.productcategoryid = s.productcategoryid
      GROUP BY c.name
    note: >
      Ratio of aggregates with an explicit formula in the question - and the
      unweighted AVG still differs by up to 5x (Clothing 0.98 vs 0.20), so a
      model that skims the formula and reaches for AVG(unitpricediscount) is
      caught. Returns 4 rows.

  # Trap (by construction): reading "both ... but none" as "either 2012 or
  # 2013, none in 2014" (UNION instead of INTERSECT) gives a different count,
  # as does counting orders instead of distinct customers.
  - id: q49
    question: How many customers placed at least one sales order in both 2012 and 2013 but none in 2014? Return a single number.
    lang: en
    category: set_ops
    tables: [sales.salesorderheader]
    ordered: false
    expected_chart: [none]
    gold_sql: >
      SELECT COUNT(*) AS customers FROM (
        (SELECT customerid FROM sales.salesorderheader
         WHERE orderdate >= DATE '2012-01-01' AND orderdate < DATE '2013-01-01'
         INTERSECT
         SELECT customerid FROM sales.salesorderheader
         WHERE orderdate >= DATE '2013-01-01' AND orderdate < DATE '2014-01-01')
        EXCEPT
        SELECT customerid FROM sales.salesorderheader
        WHERE orderdate >= DATE '2014-01-01' AND orderdate < DATE '2015-01-01') t
    note: >
      Three-way set composition (INTERSECT then EXCEPT, or the equivalent
      EXISTS chain). Answer: 1,225.

  # Trap (by construction): any formulation that only groups existing orders
  # returns all 17 salespeople (including twelve 0-month rows) or miscounts;
  # the row-count check catches both.
  - id: q50
    question: Which salespeople had at least one calendar month of 2013 in which they were the salesperson on no sales orders at all? Show the first name, the last name and the number of such months.
    lang: en
    category: calendar
    tables: [sales.salesperson, sales.salesorderheader, person.person]
    ordered: false
    expected_chart: [bar, none]
    gold_sql: >
      SELECT pe.firstname, pe.lastname, COUNT(*) AS months_without_orders
      FROM sales.salesperson sp
      JOIN person.person pe ON pe.businessentityid = sp.businessentityid
      CROSS JOIN generate_series(DATE '2013-01-01', DATE '2013-12-01', INTERVAL '1 month') m
      WHERE NOT EXISTS (
        SELECT 1 FROM sales.salesorderheader h
        WHERE h.salespersonid = sp.businessentityid
          AND DATE_TRUNC('month', h.orderdate) = m)
      GROUP BY pe.firstname, pe.lastname
    note: >
      Counting absence: the rows to count do not exist in any table, so the
      query must manufacture the month spine and anti-join it. Returns 5 rows
      (Syed Abbas 7, three at 4, one at 1). All 17 salespeople had at least one
      2013 order, so 12-minus-distinct-months over their orders is an
      acceptable equivalent - the filter to "at least one such month" is what
      the spineless version tends to get wrong.

  # Trap (by construction): joining employeepayhistory raw duplicates each
  # employee once per raise (row count grows and rates disagree); dropping the
  # enddate filter adds employees who have since left Engineering.
  - id: q51
    question: Which employees currently work in the Engineering department, according to the department history? Show each one's first name, last name and current pay rate - the rate on their most recent pay-change row.
    lang: en
    category: temporal
    tables: [humanresources.employeedepartmenthistory, humanresources.department, humanresources.employeepayhistory, person.person]
    ordered: false
    expected_chart: [none, bar]
    gold_sql: >
      SELECT pe.firstname, pe.lastname, cur.rate
      FROM humanresources.employeedepartmenthistory edh
      JOIN humanresources.department dp
        ON dp.departmentid = edh.departmentid AND dp.name = 'Engineering'
      JOIN person.person pe ON pe.businessentityid = edh.businessentityid
      JOIN LATERAL (
        SELECT rate FROM humanresources.employeepayhistory ph
        WHERE ph.businessentityid = edh.businessentityid
        ORDER BY ph.ratechangedate DESC LIMIT 1) cur ON true
      WHERE edh.enddate IS NULL
    note: >
      Two effective-dated history tables at once: "currently in the
      department" is enddate IS NULL on one, "current rate" is the latest row
      of the other (LATERAL, DISTINCT ON, or a windowed subquery all work).
      Returns 6 rows. Extends the existing q23/q33, which each need only one
      of the two moves.

  # Trap (verified): the single-FROM version multiplies the two detail tables
  # through their shared product: Accessories comes out 19,609,196 in "sales
  # revenue" instead of 1,272,073 — a 15x inflation that still looks like
  # money.
  - id: q52
    question: For each product category that has both sales and purchases, show the category name, the total sales revenue (unitprice times 1 minus unitpricediscount times quantity, over sales order lines) and the total purchasing spend (unitprice times quantity, over purchase order lines), each rounded to two decimals.
    lang: en
    category: multi_level_agg
    tables: [sales.salesorderdetail, purchasing.purchaseorderdetail, production.product, production.productsubcategory, production.productcategory]
    ordered: false
    expected_chart: [bar]
    gold_sql: >
      WITH sold AS (
        SELECT c.name, SUM(d.unitprice * (1 - d.unitpricediscount) * d.orderqty) AS sales_revenue
        FROM sales.salesorderdetail d
        JOIN production.product p ON p.productid = d.productid
        JOIN production.productsubcategory s ON s.productsubcategoryid = p.productsubcategoryid
        JOIN production.productcategory c ON c.productcategoryid = s.productcategoryid
        GROUP BY c.name),
      bought AS (
        SELECT c.name, SUM(pd.unitprice * pd.orderqty) AS purchase_spend
        FROM purchasing.purchaseorderdetail pd
        JOIN production.product p ON p.productid = pd.productid
        JOIN production.productsubcategory s ON s.productsubcategoryid = p.productsubcategoryid
        JOIN production.productcategory c ON c.productcategoryid = s.productcategoryid
        GROUP BY c.name)
      SELECT sold.name, ROUND(sold.sales_revenue, 2) AS sales_revenue,
             ROUND(bought.purchase_spend, 2) AS purchase_spend
      FROM sold JOIN bought ON bought.name = sold.name
    note: >
      The AdventureWorks version of car_rental q31, across two schemas: sales
      and purchasing lines both hang off product, and no product-level join
      may connect them directly. Bikes are sold but never purchased, so the
      inner join returns 3 rows - which the question pins ("that has both").

  # Trap (verified): filter-then-window gives January 2013 its own revenue as
  # the average; a RANGE/default frame over a month-truncated ORDER BY happens
  # to agree here (unique months), so the discriminator is evaluation order.
  - id: q53
    question: Show the three-month trailing moving average of monthly sales revenue, counting the total due on each order - the mean of that month and the two preceding months - for every month of 2013. Compute the average over the full order history, so January 2013 averages November 2012, December 2012 and January 2013. Show the month as a date, that month's revenue and the moving average, both rounded to two decimals.
    lang: en
    category: window
    tables: [sales.salesorderheader]
    ordered: true
    expected_chart: [line, area]
    gold_sql: >
      WITH m AS (
        SELECT DATE_TRUNC('month', orderdate)::date AS month, SUM(totaldue) AS revenue
        FROM sales.salesorderheader GROUP BY 1),
      ma AS (
        SELECT month, ROUND(revenue, 2) AS revenue,
               ROUND(AVG(revenue) OVER (ORDER BY month
                     ROWS BETWEEN 2 PRECEDING AND CURRENT ROW), 2) AS moving_avg
        FROM m)
      SELECT month, revenue, moving_avg
      FROM ma
      WHERE month >= DATE '2013-01-01' AND month < DATE '2014-01-01'
      ORDER BY month
    note: >
      Same construct as car_rental q35 on the other dataset, which is
      deliberate: the pair measures whether frame-clause competence transfers
      across schema scale, the comparison the two-dataset design exists for.
      Returns 12 rows; January's average is 2,538,020.95, not its own revenue.

  - id: q54
    question: What was our average discount in 2013?
    lang: en
    category: ambiguous
    tables: [sales.salesorderdetail]
    ordered: false
    gold_sql: null
    note: >
      Instantly "answerable" as AVG(unitpricediscount) - but per-line simple
      average, value-weighted average, average over only discounted lines, and
      average per order are all defensible and differ by up to 5x on this
      data (q48 exists to prove it). A system that answers without asking has
      picked one silently. The dangerous ambiguity is the one wearing a
      column's name.

  - id: q55
    question: Cine este cel mai bun agent de vânzări?
    lang: ro
    category: ambiguous
    tables: [sales.salesperson, person.person]
    ordered: false
    gold_sql: null
